name: Build & Notify
on:
  push:
    paths: &build-trigger-paths
      - 'src/**'
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths: *build-trigger-paths
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Send Jar to Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          JAR_FILE=$(ls build/libs/*-paper.jar | head -n 1)
          
          curl -v -F "payload_json={\"content\": \"✅ **Build Successful!**\nHere is the latest plugin build:\"}" \
               -F "file=@$JAR_FILE" \
               $DISCORD_WEBHOOK

      - name: Notify Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "❌ **Build Failed!**\nCheck the logs here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
               $DISCORD_WEBHOOK